<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" preserveAspectRatio="none">
    <defs>
        <linearGradient id="tech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0891b2" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <pattern id="hexagons" width="50" height="86.6" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
            <path d="M25 0 L50 14.4 L50 43.3 L25 57.7 L0 43.3 L0 14.4 Z" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.15"/>
            <path d="M25 86.6 L50 72.2 L50 43.3 L25 57.7 L0 43.3 L0 72.2 Z" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.15"/>
        </pattern>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#67e8f9" opacity="0.2"/>
        </pattern>
    </defs>
    
    <!-- Nền gradient xanh công nghệ -->
    <rect width="100%" height="100%" fill="url(#tech-grad)" />
    
    <!-- Lưới điểm -->
    <rect width="100%" height="100%" fill="url(#dots)" />
    
    <!-- Họa tiết tổ ong mờ -->
    <rect width="100%" height="100%" fill="url(#hexagons)" />
    
    <!-- Các đường mạch điện tử chéo cách điệu -->
    <g stroke="#22d3ee" stroke-opacity="0.3" fill="none" stroke-width="2">
        <path d="M -100 200 L 200 500 L 300 500 L 400 600" />
        <circle cx="400" cy="600" r="4" fill="#22d3ee" />
        
        <path d="M 800 300 L 500 600 L 500 700 L 300 900" />
        <circle cx="300" cy="900" r="4" fill="#22d3ee" />
        
        <path d="M 0 800 L 200 800 L 300 900 L 400 900" />
        <circle cx="400" cy="900" r="4" fill="#22d3ee" />
    </g>
    
    <!-- Ánh sáng glow rải rác -->
    <circle cx="100" cy="200" r="150" fill="#22d3ee" opacity="0.1" filter="blur(40px)" />
    <circle cx="600" cy="800" r="200" fill="#0284c7" opacity="0.15" filter="blur(60px)" />
</svg>
